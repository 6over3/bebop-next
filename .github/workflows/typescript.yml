name: Reusable TypeScript Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: oven-sh/setup-bun@v2

      - name: Install
        working-directory: plugins/typescript
        run: bun install --frozen-lockfile

      - name: Check and test
        working-directory: plugins/typescript
        run: |
          bun run check
          bun run test
          bun run test:packages

      - name: Create package tarballs
        working-directory: plugins/typescript
        run: bun run package

      - uses: actions/upload-artifact@v4
        with:
          name: bebop-typescript-packages
          path: plugins/typescript/dist/packages/*.tgz
          if-no-files-found: error
          retention-days: 7
