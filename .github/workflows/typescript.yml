name: Reusable TypeScript Build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - name: Install
        working-directory: plugins/typescript
        run: bun install --frozen-lockfile

      - name: Check and test
        working-directory: plugins/typescript
        run: |
          bun run check
          bun run test
          bun run test:packages

      - name: Build standalone generator
        working-directory: plugins/typescript
        run: bun run --cwd packages/generator build:binary

      - name: Pack npm packages
        working-directory: plugins/typescript
        run: bun run package

      - uses: actions/upload-artifact@v4
        with:
          name: bebop-typescript
          path: plugins/typescript/dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 7
