name: Reusable Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: x64
      build-type:
        required: false
        type: string
        default: Release
      swift-version:
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ${{ inputs.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Swift (Linux)
        if: inputs.swift-version != '' && runner.os == 'Linux'
        run: |
          arch=$([ "${{ inputs.arch }}" = "arm64" ] && echo "aarch64" || echo "x86_64")
          url="https://download.swift.org/swift-${{ inputs.swift-version }}-release/ubuntu2404-${arch}/swift-${{ inputs.swift-version }}-RELEASE/swift-${{ inputs.swift-version }}-RELEASE-ubuntu24.04-${arch}.tar.gz"
          curl -fsSL "$url" -o swift.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar xzf swift.tar.gz -C /opt/swift --strip-components=1
          echo "/opt/swift/usr/bin" >> "$GITHUB_PATH"

      - name: Setup Swift (Windows)
        if: inputs.swift-version != '' && runner.os == 'Windows'
        run: winget install --id Swift.Toolchain -e --accept-source-agreements --accept-package-agreements

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build/cmake -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} -DCMAKE_OSX_ARCHITECTURES=${{ inputs.arch == 'x64' && 'x86_64' || inputs.arch }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build/cmake -DCMAKE_BUILD_TYPE=${{ inputs.build-type }}

      - name: Configure (Windows x64)
        if: runner.os == 'Windows' && inputs.arch == 'x64'
        run: cmake -B build/cmake -G "Visual Studio 17 2022" -A x64

      - name: Configure (Windows ARM64)
        if: runner.os == 'Windows' && inputs.arch == 'arm64'
        run: cmake -B build/cmake -G "Visual Studio 17 2022" -A ARM64

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: cmake --build build/cmake --config ${{ inputs.build-type }} --parallel

      - name: Setup ASAN (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvcPath = Get-ChildItem "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1
          $arch = if ("${{ inputs.arch }}" -eq "arm64") { "Hostarm64\arm64" } else { "Hostx64\x64" }
          $binPath = "$($msvcPath.FullName)\bin\$arch"
          echo "$binPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Test
        if: runner.os != 'macOS' || inputs.arch == 'x64' || runner.arch == 'ARM64'
        working-directory: build/cmake
        run: ctest --output-on-failure -C ${{ inputs.build-type }}

      - name: Upload bebopc
        uses: actions/upload-artifact@v4
        with:
          name: bebopc-${{ inputs.os }}-${{ inputs.arch }}
          path: build
          if-no-files-found: error
          retention-days: 7
