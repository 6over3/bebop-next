name: Reusable Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      arch:
        required: false
        type: string
        default: x64
      build-type:
        required: false
        type: string
        default: Release
      swift-version:
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ${{ inputs.os }}
    env:
      MSBUILDDISABLENODEREUSE: "1"

    steps:
      - name: Exclude Windows workspace from Defender
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE"
          Add-MpPreference -ExclusionProcess @(
            "cmake.exe", "ctest.exe", "cpack.exe", "ninja.exe", "msbuild.exe",
            "cl.exe", "clang-cl.exe", "link.exe", "lld-link.exe",
            "llvm-lib.exe", "llvm-ar.exe", "llvm-rc.exe", "llvm-mt.exe", "rc.exe", "mt.exe"
          )

      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - uses: oven-sh/setup-bun@v2

      - name: Select Xcode 26
        if: runner.os == 'macOS'
        run: sudo xcode-select --switch /Applications/Xcode_26.3.app

      - name: Setup Swift
        if: inputs.swift-version != '' && runner.os != 'macOS'
        uses: ./.github/actions/setup-swift
        with:
          swift-version: ${{ inputs.swift-version }}
          arch: ${{ inputs.arch }}

      - name: Setup MSVC environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $compiler = "$env:ProgramFiles\LLVM\bin\clang-cl.exe"
          & $compiler --version
          "BEBOP_CLANG_CL=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $arch = if ("${{ inputs.arch }}" -eq "arm64") { "arm64" } else { "x64" }
          $devCmd = "$vsPath\Common7\Tools\VsDevCmd.bat"
          $environment = & $env:ComSpec /d /c "call `"$devCmd`" -no_logo -arch=$arch -host_arch=$arch >nul && set"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not initialize the MSVC environment"
          }
          $environment | ForEach-Object {
            if ($_ -match '^(INCLUDE|LIB|LIBPATH|PATH)=') {
              $_ | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            }
          }

      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build/cmake -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} -DCMAKE_OSX_ARCHITECTURES=${{ inputs.arch == 'x64' && 'x86_64' || inputs.arch }}

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -B build/cmake -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} -DCMAKE_C_COMPILER=gcc-15 -DCMAKE_CXX_COMPILER=g++-15

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = if ("${{ inputs.arch }}" -eq "arm64") { "aarch64-pc-windows-msvc" } else { "x86_64-pc-windows-msvc" }
          cmake -B build/cmake -G Ninja -DCMAKE_BUILD_TYPE=${{ inputs.build-type }} "-DCMAKE_C_COMPILER=$env:BEBOP_CLANG_CL" "-DCMAKE_CXX_COMPILER=$env:BEBOP_CLANG_CL" "-DCMAKE_C_FLAGS_INIT=--target=$target" "-DCMAKE_CXX_FLAGS_INIT=--target=$target" -DCMAKE_LINKER_TYPE=LLD

      - name: Build (Unix)
        if: runner.os != 'Windows'
        run: cmake --build build/cmake -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --build build/cmake --config ${{ inputs.build-type }} --parallel $env:NUMBER_OF_PROCESSORS -- -k 0

      - name: Test
        id: tests
        if: runner.os != 'macOS' || inputs.arch == 'x64' || runner.arch == 'ARM64'
        working-directory: build/cmake
        run: ctest --output-on-failure -C ${{ inputs.build-type }}

      - name: Diagnose Windows test crash
        if: failure() && runner.os == 'Windows' && steps.tests.outcome == 'failure'
        shell: pwsh
        run: |
          & "$env:ProgramFiles\LLVM\bin\lldb.exe" --batch -o run -o "thread backtrace all" -o "register read" -- build/bin/test_cpp_well_known.exe

      - name: Install release files
        run: cmake --install build/cmake --prefix "${{ github.workspace }}/build/staging" --config ${{ inputs.build-type }}

      - name: Relocate package
        run: cmake -E rename build/staging build/package

      - name: Configure package test (Linux)
        if: runner.os == 'Linux'
        run: cmake -S plugins/cpp/tests/package -B build/package-test "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/package" -DCMAKE_CXX_COMPILER=g++-15

      - name: Configure package test (macOS)
        if: runner.os == 'macOS'
        run: cmake -S plugins/cpp/tests/package -B build/package-test "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/package" -DCMAKE_OSX_ARCHITECTURES=${{ inputs.arch == 'x64' && 'x86_64' || inputs.arch }}

      - name: Configure package test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $target = if ("${{ inputs.arch }}" -eq "arm64") { "aarch64-pc-windows-msvc" } else { "x86_64-pc-windows-msvc" }
          cmake -S plugins/cpp/tests/package -B build/package-test "-DCMAKE_PREFIX_PATH=${{ github.workspace }}/build/package" -G Ninja -DCMAKE_BUILD_TYPE=Release "-DCMAKE_CXX_COMPILER=$env:BEBOP_CLANG_CL" "-DCMAKE_CXX_FLAGS_INIT=--target=$target" -DCMAKE_LINKER_TYPE=LLD

      - name: Build package test
        run: cmake --build build/package-test --config Release --parallel

      - name: Test installed package
        if: runner.os != 'macOS' || inputs.arch == 'x64' || runner.arch == 'ARM64'
        run: ctest --test-dir build/package-test --output-on-failure -C Release

      - name: Upload bebopc
        uses: actions/upload-artifact@v4
        with:
          name: bebopc-${{ inputs.os }}-${{ inputs.arch }}
          path: build/package
          if-no-files-found: error
          retention-days: 7
