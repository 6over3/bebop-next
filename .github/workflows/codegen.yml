name: Reusable Codegen Test

on:
  workflow_call:
    inputs:
      artifact:
        required: true
        type: string
      generator:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4

      - name: Download bebopc
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          path: dist

      - name: Show structure
        run: find dist -type f | head -20

      - name: Make bebopc executable
        run: chmod +x dist/bin/bebopc dist/bin/bebopc-gen-*

      - name: Generate code
        run: |
          mkdir -p generated
          generator_options=()
          if [ "${{ inputs.generator }}" = "cpp" ]; then
            generator_options=(-D emit_pmr=true)
          fi
          dist/bin/bebopc build tests/fixtures/valid/codegen_base.bop tests/fixtures/valid/codegen_all.bop \
            -I tests/fixtures/valid \
            --${{ inputs.generator }}_out=generated "${generator_options[@]}"

      - name: Compile and run (C++)
        if: inputs.generator == 'cpp'
        run: |
          for mode in native fallback; do
            compiler_flags=()
            if [ "$mode" = "fallback" ]; then
              compiler_flags=(-DBEBOP_CPP_NO_NATIVE_INT128=1 -DBEBOP_CPP_NO_NATIVE_FLOAT16=1 -DBEBOP_CPP_NO_NATIVE_BFLOAT16=1)
            fi
            g++-15 -std=c++23 -O2 -Wall -Wextra -Wpedantic -Werror \
              -I dist/include -I generated "${compiler_flags[@]}" \
              plugins/cpp/tests/full_schema_test.cc -o "generated/check-${mode}"
            "generated/check-${mode}"
          done

      - name: Compile (C)
        if: inputs.generator == 'c'
        run: |
          gcc-15 -c -Wall -Wextra -Werror -pedantic -std=c23 \
            -Wno-deprecated-declarations \
            -I dist/include \
            generated/*.c

      - uses: actions/setup-node@v4
        if: inputs.generator == 'typescript'
        with:
          node-version: 26

      - uses: oven-sh/setup-bun@v2
        if: inputs.generator == 'typescript'

      - name: Compile (TypeScript)
        if: inputs.generator == 'typescript'
        run: |
          cd plugins/typescript
          bun install --frozen-lockfile
          bun run build
          cd ../..
          cat > generated/tsconfig.json <<'EOF'
          {
            "compilerOptions": {
              "target": "ESNext",
              "module": "Preserve",
              "moduleResolution": "bundler",
              "strict": true,
              "noUncheckedIndexedAccess": true,
              "exactOptionalPropertyTypes": true,
              "noEmit": true,
              "paths": {
                "@bebop/runtime": ["../plugins/typescript/packages/runtime/src/index.ts"],
                "@bebop/runtime/rpc/protocol": ["../plugins/typescript/packages/runtime/src/rpc.bb.ts"],
                "@bebop/runtime/*": ["../plugins/typescript/packages/runtime/src/*"]
              }
            },
            "include": ["*.ts"]
          }
          EOF
          node plugins/typescript/node_modules/typescript/bin/tsc -p generated/tsconfig.json
